[build-system]
requires = ["setuptools>=77", "wheel>=0.45"]
build-backend = "darkfusion_build"
backend-path = ["."]

[project]
name = "ultradarkfusion"
dynamic = ["version", "dependencies", "optional-dependencies"]
description = "DarkFusion desktop image annotation, dataset preparation, and model training tools"
readme = "distribution/README.md"
requires-python = ">=3.12,<3.13"
license = "AGPL-3.0-only"
license-files = ["LICENSE.txt"]
authors = [{name = "DarkFusion contributors"}]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Win32 (MS Windows)",
  "Intended Audience :: Developers",
  "Operating System :: Microsoft :: Windows",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.urls]
Homepage = "https://github.com/lordofkillz/DarkFusion"
Repository = "https://github.com/lordofkillz/DarkFusion"
Issues = "https://github.com/lordofkillz/DarkFusion/issues"
Documentation = "https://github.com/lordofkillz/DarkFusion/blob/main/USER_GUIDE.md"

[project.scripts]
darkfusion = "ultradarkfusion:main"
ultradarkfusion = "ultradarkfusion:main"

[tool.setuptools]
package-dir = {"" = "distribution"}
packages = ["ultradarkfusion"]
include-package-data = true

[tool.setuptools.package-data]
ultradarkfusion = ["application.zip", "manifest.json", "VERSION"]

[tool.setuptools.dynamic]
version = {file = ["VERSION"]}
dependencies = {file = ["distribution/requirements-pypi.txt"]}

[tool.setuptools.dynamic.optional-dependencies]
tensorrt = {file = ["distribution/requirements-tensorrt.txt"]}
