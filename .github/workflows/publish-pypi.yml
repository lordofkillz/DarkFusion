name: Build and publish Python packages

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the tested application and theme packages to PyPI
        type: boolean
        required: true
        default: false

permissions:
  contents: read

concurrency:
  group: pypi-release
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          architecture: x64
      - name: Build application and automatically installed theme assets
        run: |
          python -m pip install --upgrade build twine
          python darkfusion_build.py --outdir dist
          python -m twine check --strict dist/*.whl dist/*.tar.gz
      - name: Install the built wheels in the clean Python environment
        shell: pwsh
        run: |
          $wheels = Get-ChildItem -LiteralPath dist -Filter *.whl
          python -m pip install $wheels.FullName
          python -m pip check
          darkfusion --version
          darkfusion --check
      - name: Record an import-only desktop smoke check
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python -c "import os,sys; from pathlib import Path; from ultradarkfusion import prepare; p=prepare()/'UltraDarkFusion'; os.chdir(p); sys.path.insert(0,str(p)); import UltraDarkFusion; print('Packaged desktop imports passed')"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: python-distributions
          path: |
            dist/*.whl
            dist/*.tar.gz
          if-no-files-found: error

  publish:
    if: ${{ inputs.publish }}
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: python-distributions
          path: dist/
      - name: Publish verified distributions using PyPI Trusted Publishing
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1
        with:
          packages-dir: dist/
          skip-existing: true
