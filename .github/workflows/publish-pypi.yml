name: Build and publish Python packages

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the tested application and theme packages to PyPI
        type: boolean
        required: true
        default: false
      bootstrap:
        description: Activate the first pending publisher without uploading files
        type: boolean
        required: true
        default: false

permissions:
  contents: read

concurrency:
  group: pypi-release
  cancel-in-progress: false

jobs:
  build:
    if: ${{ !inputs.bootstrap }}
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          architecture: x64
      - name: Build application and automatically installed theme assets
        run: |
          python -m pip install --upgrade build twine
          python darkfusion_build.py --outdir dist
          python -m twine check --strict dist/*.whl dist/*.tar.gz
      - name: Install the built wheels in the clean Python environment
        shell: pwsh
        run: |
          $wheels = Get-ChildItem -LiteralPath dist -Filter *.whl
          python -m pip install $wheels.FullName
          python -m pip check
          darkfusion --version
          darkfusion --check
      - name: Verify desktop startup and settings saving
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          $env:DARKFUSION_DATA_DIR = Join-Path $env:RUNNER_TEMP "darkfusion-startup-test"
          python distribution/check_install.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: python-distributions
          path: |
            dist/*.whl
            dist/*.tar.gz
          if-no-files-found: error

  publish:
    if: ${{ always() && inputs.publish && (inputs.bootstrap || needs.build.result == 'success') }}
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - name: Activate a pending publisher without uploading distributions
        if: ${{ inputs.bootstrap }}
        run: |
          python - <<'PY'
          import json, os, urllib.request, urllib.error
          try:
              request = urllib.request.Request(
                  os.environ['ACTIONS_ID_TOKEN_REQUEST_URL'] + '&audience=pypi',
                  headers={'Authorization': 'Bearer ' + os.environ['ACTIONS_ID_TOKEN_REQUEST_TOKEN']})
              with urllib.request.urlopen(request, timeout=30) as stream:
                  identity = json.load(stream)
              request = urllib.request.Request('https://pypi.org/_/oidc/mint-token',
                  data=json.dumps({'token': identity['value']}).encode(),
                  headers={'Content-Type': 'application/json'}, method='POST')
              with urllib.request.urlopen(request, timeout=30) as stream:
                  result = json.load(stream)
              if not result.get('token'):
                  raise SystemExit('PyPI did not activate the pending publisher.')
          except urllib.error.HTTPError as error:
              raise SystemExit(f'Publisher activation failed: HTTP {error.code}') from None
          # Ephemeral credentials are neither printed nor saved to an artifact.
          print('Pending publisher activated. No distribution files uploaded.')
          PY
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        if: ${{ !inputs.bootstrap }}
        with:
          name: python-distributions
          path: dist/
      - name: Publish verified distributions using PyPI Trusted Publishing
        if: ${{ !inputs.bootstrap }}
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1
        with:
          packages-dir: dist/
          skip-existing: true
